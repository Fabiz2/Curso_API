name: CI da API

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: action/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: build
        run: ./mvnw -B package
